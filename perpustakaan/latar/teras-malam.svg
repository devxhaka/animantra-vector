<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
  <!-- langit malam -->
  <rect width="1080" height="1920" fill="#2b3a5c"/>
  <rect y="0" width="1080" height="420" fill="#1f2b47"/>
  <circle cx="830" cy="230" r="70" fill="#f3ecd2" stroke="#1d1d1f" stroke-width="6"/>
  <circle cx="805" cy="210" r="14" fill="#ddd3b2"/><circle cx="850" cy="255" r="9" fill="#ddd3b2"/>
  <g fill="#f3ecd2"><circle cx="160" cy="150" r="5"/><circle cx="420" cy="90" r="4"/><circle cx="600" cy="260" r="4"/><circle cx="980" cy="420" r="5"/><circle cx="300" cy="330" r="3"/></g>
  <!-- siluet atap rumah tetangga -->
